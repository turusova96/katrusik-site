<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена</title>
<style>
  :root { --bg:#faf9f7; --ink:#24201c; --muted:#7d756c; --accent:#9a6b4f; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#1a1816; --ink:#ece7e0; --muted:#9c938a; --accent:#c79a7d; }
  }
  body {
    margin:0; min-height:100vh; display:grid; place-items:center;
    padding:32px 16px; background:var(--bg); color:var(--ink); text-align:center;
    font:16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  h1 { font-size:1.5rem; margin:0 0 10px; letter-spacing:-.02em; }
  p { color:var(--muted); margin:0 0 24px; }
  a { color:var(--accent); }
</style>
</head>
<body>
  <main>
    <h1>Такой страницы нет</h1>
    <p>Возможно, ссылка устарела.</p>
    <p><a href="/">На главную</a></p>
  </main>
</body>
</html>
